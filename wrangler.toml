name = "codenow-backend"
main = "worker/index.ts"
compatibility_date = "2026-09-04"

[ai]
binding = "AI"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "codenow-licenses"

# Set ADMIN_CODE_SECRET in Cloudflare before using /api/admin/codes.
# Optional anonymous analytics:
# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "YOUR_KV_NAMESPACE_ID"
